name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: yarn

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Build
      run: NODE_OPTIONS=--openssl-legacy-provider yarn build

    - name: Install Surge
      if: github.event_name == 'push'
      run: npm i -g surge

    - name: Deploy to Surge
      if: github.event_name == 'push'
      run: surge ./build react-corona-app.surge.sh --token ${{ secrets.SURGE_TOKEN }}
